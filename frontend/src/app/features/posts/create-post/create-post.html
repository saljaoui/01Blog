<div class="d-flex flex-column vh-100">
  <app-header></app-header>
  <div class="w-100 p-4 overflow-y-scroll" style="height: calc(100vh - 48px);">
    <div class="container-custom d-flex gap-4">
      <div class="main-content d-flex flex-column p-4 bg-white rounded-4 shadow-sm overflow-hidden mx-auto">
        <div class="flex-grow-1">
          <div class="mb-3">
            <input type="text" class="form-control title" [(ngModel)]="blogTitle" placeholder="Title...">
          </div>

          <!-- Dynamic content blocks -->
          <div *ngFor="let block of contentBlocks; let i = index" class="mb-3 position-relative">

            <div *ngIf="block.type === 'text'" class="position-relative">
              <textarea class="form-control content" [(ngModel)]="block.content" rows="4"
                placeholder="Write your content here..."> </textarea>
              <button type="button" class="remove-btn position-absolute top-0 end-0 m-2"
                (click)="removeBlock(i)">×</button>
            </div>

            <div *ngIf="block.type === 'image'" class="position-relative">
              <img [src]="block.content" class="img-fluid rounded w-100"
                style="max-height: 400px; object-fit: contain;">
              <button type="button" class="remove-btn position-absolute top-0 end-0 m-2"
                (click)="removeBlock(i)">×</button>
            </div>

            <div *ngIf="block.type === 'heading'" class="position-relative">
              <input type="text" class="form-control fw-bold fs-4" [(ngModel)]="block.content"
                placeholder="Enter heading...">
              <button type="button" class="remove-btn position-absolute top-0 end-0 m-2"
                (click)="removeBlock(i)">×</button>
            </div>
          </div>

          <!-- Show message when no blocks exist (outside the ngFor loop) -->
          <div *ngIf="contentBlocks.length === 0" class="text-center p-4 border border-dashed rounded mb-3">
            <p class="text-muted mb-0">No content blocks added yet. Use the buttons on the right to add text or images.
            </p>
            <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 32 32" class="svg">
              <path
                d="M29 24.5a4.5 4.5 0 0 1-4.5 4.5h-17A4.5 4.5 0 0 1 3 24.5v-17A4.5 4.5 0 0 1 7.5 3h17A4.5 4.5 0 0 1 29 7.5zM7.5 4A3.5 3.5 0 0 0 4 7.5V10h24V7.5A3.5 3.5 0 0 0 24.5 4zM4 11v13.5A3.5 3.5 0 0 0 7.5 28h17a3.5 3.5 0 0 0 3.5-3.5V11z" />
            </svg>
          </div>

        </div>
      </div>

      <div class="right-sidebar d-flex flex-column gap-2">
        <div class="bg-white rounded-4 d-flex flex-column shadow-sm gap-2 p-3">
          <h6 class="fw-semibold text-muted mb-2">Add blocks:</h6>

          <button type="button" class="btn btn-outline-primary btn-sm" (click)="addHeadingBlock()">
            Add Heading
          </button>

          <button type="button" class="btn btn-outline-primary btn-sm" (click)="addTextBlock()">
            Add Paragraph
          </button>

          <button type="button" class="btn btn-outline-primary btn-sm" (click)="triggerImageUpload()">
            Add Image
          </button>

          <input type="file" #imageUpload accept="image/*" style="display: none;" (change)="handleImageUpload($event)">
        </div>
        <div class="bg-white rounded-4 d-flex flex-column shadow-sm gap-2 p-3">
          <button type="button" class="btn-primary" (click)="createPost()">Create</button>
          <button type="button" class="btn-secondary" (click)="cancelPost()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
