<div
    class="bg-white rounded-3xl shadow-2xl overflow-hidden min-h-[500px] flex relative w-[800px] max-h-[700px]">
    <!-- Left Section -->
    <div
        class="flex-1 p-6 bg-gradient-to-br from-indigo-100 via-indigo-200 to-indigo-300 flex items-center justify-center relative overflow-hidden m-2 rounded-2xl">
        <!-- Shapes -->
        <div
            class="absolute w-[120px] h-[120px] bg-gradient-to-tr from-indigo-600 to-purple-600 top-[50px] right-[70px] rotate-45 opacity-80 rounded-2xl"></div>
        <div
            class="absolute w-[80px] h-[80px] bg-white bottom-[80px] left-[60px] rounded-full opacity-90"></div>
        <div
            class="absolute w-[60px] h-[60px] bg-gradient-to-tr from-cyan-500 to-cyan-700 top-[140px] left-[40px] rotate-[30deg] opacity-70 rounded-2xl"></div>

        <!-- Illustration -->
        <div class="relative z-10">
            <div
                class="w-[200px] h-[200px] bg-gradient-to-br from-indigo-600 to-purple-600 rounded-full flex items-center justify-center shadow-[0_15px_30px_rgba(79,70,229,0.3)] animate-spin-slow animate-pulse-soft">
                <div
                    class="w-[120px] h-[120px] bg-white rounded-full animate-pulse-inner"></div>
            </div>
        </div>
    </div>

    <!-- Right Section -->
    <div class="flex-1 px-12 pb-14 pt-8 flex flex-col justify-center">
        <!-- Logo -->
        <div class="flex items-center mb-10">
            <div
                class="w-4 h-4 mr-1 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-full flex items-center justify-center shadow-[0_15px_30px_rgba(79,70,229,0.3)] animate-spin-slow animate-pulse-soft">
                <div
                    class="w-2 h-2 bg-white rounded-full animate-pulse-inner"></div>
            </div>
            <div class="text-xl font-medium text-gray-800">1Blog</div>
        </div>

        <div class="text-gray-400 text-sm font-medium mb-4">START SHARING YOUR JOURNEY</div>

        <form>
            <!-- Email -->
            <div class="mb-5">
                <label for="email"
                    class="block text-sm font-medium text-gray-700 mb-2">E-Mail</label>
                <input type="email" id="email" placeholder="yourname@gmail.com"
                    required
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-base transition-all duration-300 bg-white placeholder-gray-400 focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-200 hover:ring-2 hover:ring-indigo-200">
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label for="password"
                    class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password"
                        placeholder="••••••••••••" required
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-base transition-all duration-300 bg-white placeholder-gray-400 focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-200 hover:ring-2 hover:ring-indigo-200">
                    <button type="button" onclick="togglePassword()"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <!-- Eye SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6"
                            fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path
                                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Button -->
            <button type="submit"
                class="relative w-full bg-gradient-to-br from-indigo-600 to-purple-600 text-white py-4 rounded-xl text-base font-semibold cursor-pointer transition-all duration-200 mt-2 shadow-lg hover:-translate-y-0.5 hover:shadow-xl active:translate-y-0 overflow-hidden">
                SIGN IN
            </button>

        </form>

        <p class="text-gray-500 text-sm mt-3">Don't have an account?
            <a href="/register"
                class="text-indigo-600 font-medium hover:underline">Sign Up</a>
        </p>

        <div class="text-center mt-6 text-xs text-gray-400">
            By signing in, you agree to our Terms & Privacy Policy
        </div>
    </div>
</div>
