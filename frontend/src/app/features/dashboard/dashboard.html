 <div class="d-flex flex-column vh-100">
        <!-- Header -->
        <app-header></app-header>

        <!-- Main Layout -->
        <div class="main-layout">
            <div class="container-custom d-flex gap-6">

                <div class="left-sidebar section">
                    <app-profile-card></app-profile-card>
                </div>

                <div class="main-content d-flex flex-column">
                    <!-- Create Post Section -->
                    <app-create-post-section></app-create-post-section>

                    <!-- Posts Feed -->
                    <div class="posts-feed space-y-2">
                        <!-- Post 1 -->
                        <app-post-card></app-post-card>

                        <!-- Post 2 -->
                        <div class="post-card">
                            <div class="d-flex align-items-center mb-3">
                                <div class="avatar"></div>
                                <div>
                                    <p class="username">User Name</p>
                                    <p class="timestamp">2 hours ago</p>
                                </div>
                            </div>
                            <!-- Post Content -->
                            <div class="post-content">
                                <p>
                                    Beautiful art! 
                                    <span class="hashtags">#art #aesthetics #wallstreet #wallpaper #photography</span>
                                </p>
                            </div>

                            <!-- Engagement Section -->
                            <div class="mt-2">
                                <!-- Reaction Stats -->
                                <div class="d-flex align-items-center justify-content-between">
                                    <div class="d-flex align-items-center" style="gap: 1rem;">
                                        <button class="reaction-btn heart-btn">
                                            <svg class="reaction-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                <path fill="currentColor"

                                            <span class="reaction-count">320k</span>
                                        </button>

                                        <button class="reaction-btn comment-btn">
                                            <svg class="reaction-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                                <g fill="none" stroke="currentColor" stroke-width="1.5">
                                                    <path
                                                        d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2S2 6.477 2 12c0 1.6.376 3.112 1.043 4.453c.178.356.237.763.134 1.148l-.595 2.226a1.3 1.3 0 0 0 1.591 1.591l2.226-.595a1.634 1.634 0 0 1 1.149.133A9.958 9.958 0 0 0 12 22Z" />

                                            </svg>
                                            <span class="reaction-count">120</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>

                <div class="right-sidebar section">
                    <app-sidebar-user></app-sidebar-user>
                </div>

            </div>
        </div>

    </div>
