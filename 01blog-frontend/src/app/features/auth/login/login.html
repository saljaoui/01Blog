   <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="main-container d-flex position-relative">
            <!-- Left Section -->
            <div class="left-section d-flex align-items-center justify-content-center flex-fill">
                <!-- Geometric Shapes -->
                <div class="geometric-shape shape-1"></div>
                <div class="geometric-shape shape-2"></div>
                <div class="geometric-shape shape-3"></div>
                
                <!-- Main Circle -->
                <div class="main-circle d-flex align-items-center justify-content-center">
                    <div class="inner-circle d-flex align-items-center justify-content-center">
                    </div>
                </div>
            </div>

            <!-- Right Section -->
            <div class="flex-fill d-flex flex-column justify-content-center p-5">
                <!-- Logo -->
                <div class="d-flex align-items-center mb-4">
                    <div class="logo-circle d-flex align-items-center justify-content-center">
                        <div class="logo-inner"></div>
                    </div>
                    <h1 class="logo-text">1Blog</h1>
                </div>

                <p class="start-text mb-4">Start Sharing Your Journey</p>

                <!-- Login Form -->
                <form id="loginForm">
                    <!-- Email -->
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">E-Mail</label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email"
                            placeholder="yourname@gmail.com" 
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                class="form-control"
                                id="password" 
                                placeholder="••••••••••••" 
                                required
                            >
                            <button type="button" class="eye-icon" onclick="togglePassword()">
                                <!-- Eye SVG -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary-custom mb-4" id="loginBtn">
                        Sign In
                    </button>
                </form>

                <!-- Sign Up Link -->
                <p class="signup-text text-center mb-3">
                    Don't have an account?
                    <a href="/register" class="text-black fw-medium text-decoration-none">Sign Up</a>
                </p>

                <!-- Terms -->
                <div class="text-center terms-text">
                    By signing in, you agree to our Terms & Privacy Policy
                </div>
            </div>
        </div>
    </div>
