<div class="container">
    <div class="left-section">
            <div class="geometric-shape shape-1"></div>
            <div class="geometric-shape shape-2"></div>
            <div class="geometric-shape shape-3"></div>
            <div class="illustration">
                <div class="main-graphic"></div>
        </div>
    </div>

    <div class="right-section">
        <div class="logo">
            <div class="logo-icon">O</div>
            <div class="logo-text number">1</div>
            <div class="logo-text">Blog</div>
        </div>

        <div class="header-text">START THE CONVERSATION</div>
        <h1 class="title">
            Sign In to <span class="brand">01Blog</span>
        </h1>


        <form>
            <div class="form-group">
                <label class="form-label" for="email">E-Mail</label>
                <input type="email" id="email" class="form-input" placeholder="yourname@gmail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" class="form-input" placeholder="••••••••••••" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <!-- Eye open SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">SIGN IN</button>
        </form>
        <p class="subtitle">Don't have an account? <a href="#">Sign Up</a></p>

        <div class="footer-text">
            By signing in, you agree to our Terms & Privacy Policy
        </div>
    </div>
</div>
