<div class="d-flex flex-column gap-4">

  <!-- Search + Filter -->
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
    <!-- Search -->
    <div class="search-container position-relative">
      <input
        type="text"
        class="search-input"
        placeholder="Search by title or author..."
      />
      <i class="bi bi-search position-absolute" style="top: 10px; left: 12px; color: #888;"></i>
    </div>

    <!-- Filter / Sort -->
    <div class="d-flex align-items-center gap-2">
      <label class="fw-semibold small me-1">Filter:</label>
      <select class="form-select form-select-sm w-auto">
        <option>All</option>
        <option>Reported</option>
        <option>Most Liked</option>
        <option>Recent</option>
      </select>
    </div>
  </div>

  <!-- Posts Table -->
  <div class="users-table">
    <table>
      <thead>
        <tr>
          <th>Post ID</th>
          <th>Author</th>
          <th>Excerpt</th>
          <th>Likes</th>
          <th>Comments</th>
          <th>Status</th>
          <th>Created</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>#1023</td>
          <td>John Doe</td>
          <td>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</td>
          <td>124</td>
          <td>12</td>
          <td><span class="status active">Normal</span></td>
          <td>2024-05-12</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-primary me-1">View</button>
            <button class="btn btn-sm btn-outline-dark">Delete</button>
          </td>
        </tr>

        <tr>
          <td>#1048</td>
          <td>Jane Smith</td>
          <td>This post was flagged for inappropriate content...</td>
          <td>67</td>
          <td>9</td>
          <td><span class="status banned">Reported</span></td>
          <td>2024-06-02</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-primary me-1">View</button>
            <button class="btn btn-sm btn-outline-dark">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="d-flex justify-content-end align-items-center mt-3">
    <nav>
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
      </ul>
    </nav>
  </div>

</div>
