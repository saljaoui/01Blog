<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
        <div class="main-container d-flex position-relative">
            <!-- Left Section -->
            <div class="left-section d-flex align-items-center justify-content-center flex-fill">
                <!-- Shapes -->
                <div class="shape-1"></div>
                <div class="shape-2"></div>
                <div class="shape-3"></div>

                <!-- Main Circle -->
                <div class="main-circle d-flex align-items-center justify-content-center">
                    <div class="inner-circle"></div>
                </div>
            </div>

            <!-- Right Section -->
            <div class="right-section flex-fill d-flex flex-column justify-content-center">
                <!-- Logo -->
                <div class="d-flex align-items-center mb-custom-10">
                    <div class="logo-circle d-flex align-items-center justify-content-center">
                        <div class="logo-inner"></div>
                    </div>
                    <div class="logo-text">1Blog</div>
                </div>

                <div class="start-text mt-4">SIGN UP AND START SHARING</div>

                <form>
                    <!-- Full Name -->
                    <div class="mb-custom-4">
                        <label for="fullname" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullname" placeholder="John Doe" required>
                    </div>

                    <!-- Email -->
                    <div class="mb-custom-4">
                        <label for="email" class="form-label">E-Mail</label>
                        <input type="email" class="form-control" id="email" placeholder="yourname@gmail.com" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-custom-5">
                        <label for="confirmPassword" class="form-label">Your Password</label>
                        <div class="position-relative">
                            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••••••" required>
                            <button type="button" class="eye-icon" onclick="togglePassword()">
                                <!-- Eye SVG -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Button -->
                    <button type="submit" class="btn btn-primary-custom w-100">
                        SIGN UP
                    </button>
                </form>

                <p class="signin-text">Already have an account?
                    <a href="/login" class="text-indigo fw-medium">Sign In</a>
                </p>

                <div class="text-center terms-text">
                    By signing up, you agree to our Terms & Privacy Policy
                </div>
            </div>
        </div>
    </div>
