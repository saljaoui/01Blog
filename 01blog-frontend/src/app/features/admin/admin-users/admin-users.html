<div class="d-flex flex-column">




    <!-- Search Bar -->
    <div class="search-container mb-4">
      <input type="text" id class="search-input" placeholder="Search by Username..." />
    </div>

    <!-- Users Table -->
    <div class="users-table">
      <table>
        <thead>
          <tr>
            <th>Avatar</th>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <div class="user-avatar">
                <img src="https://i.pravatar.cc/150?img=1" alt="avatar">
              </div>
            </td>
            <td>John Doe</td>
            <td>john@example.com</td>
            <td>
              <span class="status active">Active</span>
            </td>
            <td>
              <span class="btn-action">Ban</span>
            </td>
          </tr>
          <tr>
            <td>
              <div class="user-avatar">
                <img src="https://i.pravatar.cc/150?img=2" alt="avatar">
              </div>
            </td>
            <td>Jane Smith</td>
            <td>jane@example.com</td>
            <td>
              <span class="status banned">Banned</span>
            </td>
            <td>
              <span class="btn-action">Unban</span>
            </td>
          </tr>
          <!-- Add more users as needed -->
        </tbody>
      </table>
    </div>
  </div>
