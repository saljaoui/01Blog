<!-- home.component.html -->
<div class="profile-container d-flex" *ngIf="user">
    <!-- Main Content -->
    <main class="main-content pt-4">
        <div class="content-wrapper">
            <div class="container">

                <div class="cover-photo"></div>

                <div class="profile-image-wrapper">
                    <div class="profile-image">
                        <img src="https://i.pinimg.com/736x/9d/61/39/9d61392cfa6b5d8ae7c89de50f6aa1f9.jpg"
                            alt="Profile image">
                    </div>
                </div>

                <div class="profile-content">
                    <h1 class="profile-name">{{user.firstName + " " + user.lastName}}</h1>
                    <p class="profile-username">{{ "@" + user.username }}</p>
                    <p class="profile-bio">
                        {{ user.bio }}
                    </p>

                    <div class="stats-container">
                        <div class="stat-item">
                            <span class="stat-number">{{ user.followersCount }}</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">{{ user.followingCount }}</span>
                            <span class="stat-label">Following</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">{{ user.postsCount }}</span>
                            <span class="stat-label">Posts</span>
                        </div>
                    </div>

                    <button *ngIf="user.currentUser" class="follow-btn" (click)="onEditProfile()">
                        <i class="fas fa-edit"></i> Edit Profile
                    </button>

                    <!-- Follow button for other users -->
                    <button *ngIf="!user.currentUser" class="follow-btn" (click)="onFollowClick()"
                        [disabled]="isLoading">
                        <i class="fas fa-user-plus" *ngIf="!isFollowing"></i>
                        <i class="fas fa-user-check" *ngIf="isFollowing"></i>
                        {{ isFollowing ? 'Following' : 'Follow' }}
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- EDIT PROFILE POPUP -->
    <div class="edit-profile-popup" *ngIf="showEditPopup">
        <div class="popup-backdrop" (click)="closeEditPopup()"></div>
        <div class="popup-content">
            <h2>Edit Profile</h2>
            <form (ngSubmit)="submitEditProfile()">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input id="firstName" [(ngModel)]="user.firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" [(ngModel)]="user.lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" [(ngModel)]="user.bio" name="bio"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-secondary" (click)="closeEditPopup()">Cancel</button>
            </form>
        </div>
    </div>

<!-- Right Sidebar -->
<app-sidebar-right></app-sidebar-right>
</div>
