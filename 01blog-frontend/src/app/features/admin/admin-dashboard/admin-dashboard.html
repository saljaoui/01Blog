<div class="container py-4">
  <div class="row g-3 align-items-stretch">

    <!-- Total Users -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card stat-card h-100 shadow-sm">
        <div class="card-body d-flex">
          <div class="stat-icon me-3">
            <!-- user icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              viewBox="0 0 24 24">
              <g fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="6" r="4" />
                <path stroke-linecap="round"
                  d="M18 9c1.657 0 3-1.12 3-2.5S19.657 4 18 4M6 9C4.343 9 3 7.88 3 6.5S4.343 4 6 4" />
                <ellipse cx="12" cy="17" rx="6" ry="4" />
                <path stroke-linecap="round"
                  d="M20 19c1.754-.385 3-1.359 3-2.5s-1.246-2.115-3-2.5M4 19c-1.754-.385-3-1.359-3-2.5s1.246-2.115 3-2.5" />
              </g>
            </svg>
          </div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <h6 class="mb-1">Total Users</h6>
              <small class="text-muted">All time</small>
            </div>
            <div class="d-flex align-items-center">
              <h2 class="stat-number mb-0" data-value="12,345">12,345</h2>
              <span class="ms-2 badge text-bg-dark">Active</span>
            </div>
            <p class="text-muted small mb-0 mt-2">Active, verified accounts.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Total Posts -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card stat-card h-100 shadow-sm">
        <div class="card-body d-flex">
          <div class="stat-icon me-3">
            <!-- post icon -->
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
              aria-hidden="true" focusable="false">
              <path d="M4 6h16M4 10h16M8 14h8" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round" />
              <rect x="3" y="3" width="18" height="18" rx="2"
                stroke="currentColor" stroke-width="1.2" />
            </svg>
          </div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <h6 class="mb-1">Total Posts</h6>
              <small class="text-muted">All time</small>
            </div>
            <div class="d-flex align-items-center">
              <h2 class="stat-number mb-0" data-value="48,712">48,712</h2>
              <span class="ms-2 badge bg-black">new</span>
            </div>
            <p class="text-muted small mb-0 mt-2">Published & draft posts
              combined.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Pending Reports -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card stat-card h-100 shadow-sm">
        <div class="card-body d-flex">
          <div class="stat-icon me-3">
            <!-- alert/report icon -->
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
              aria-hidden="true" focusable="false">
              <path d="M12 8v4" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12 16h.01" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <h6 class="mb-1">Pending Reports</h6>
              <small class="text-muted">Needs review</small>
            </div>
            <div class="d-flex align-items-center">
              <h2 class="stat-number mb-0 text-warning" data-value="27">27</h2>
              <span class="ms-2 badge bg-danger">urgent</span>
            </div>
            <p class="text-muted small mb-0 mt-2">Reports waiting action
              (ban/dismiss).</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
