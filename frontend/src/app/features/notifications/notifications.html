<div class="page d-flex">
  <div class="notifications-container">    
    <div class="notifications-card">
      <h3>Recent Notifications</h3>
      <p class="text-muted mb-3">
        Stay up to date with the latest activity from your connections.
      </p>

      <ul class="notification-list" *ngIf="notifications.length > 0; else noNotifications">
        <li class="notification-item" [class.unread]="!notification.isRead" *ngFor="let notification of notifications" (click)="markAsRead(notification.id)">
          <div class="notification-avatar">
            <img [src]="'https://i.pravatar.cc/150?img=' + (notification.actorId.charCodeAt(0) % 10 + 1)" [alt]="notification.actorFirstName + ' ' + notification.actorLastName">
          </div>
          <div class="notification-content">
            <p>{{ notification.message }}</p>
            <span class="time">{{ formatDate(notification.createdAt) }}</span>
          </div>
          <div class="notification-toggle" *ngIf="!notification.isRead"></div>
        </li>
      </ul>

      <ng-template #noNotifications>
        <div class="no-notifications">
          <p>No notifications yet.</p>
        </div>
      </ng-template>
    </div>
  </div>
  
  <app-sidebar-right></app-sidebar-right>
</div>
