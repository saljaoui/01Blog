<!-- home.component.html -->
<div class="profile-container d-flex" *ngIf="user">
    <!-- Main Content -->
    <main class="main-content pt-4">
        <div class="content-wrapper">
            <div class="container">

                <div class="cover-photo"></div>

                <div class="profile-image-wrapper">
                    <div class="profile-image">
                        <img src="https://i.pinimg.com/736x/9d/61/39/9d61392cfa6b5d8ae7c89de50f6aa1f9.jpg"
                            alt="Profile image">
                    </div>
                </div>

                <div class="profile-content">
                    <h1 class="profile-name">{{user.firstName + " " + user.lastName}}</h1>
                    <p class="profile-username">{{ "@" + user.username }}</p>
                    <p class="profile-bio">
                        {{ user.bio }}
                    </p>

                    <div class="stats-container">
                        <div class="stat-item">
                            <span class="stat-number">{{ user.followersCount }}</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">{{ user.followingCount }}</span>
                            <span class="stat-label">Following</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">{{ user.postsCount }}</span>
                            <span class="stat-label">Posts</span>
                        </div>
                    </div>

                    <button *ngIf="user.currentUser" class="follow-btn">
                        <i class="fas fa-edit"></i> Edit Profile
                    </button>

                    <!-- Follow button for other users -->
                    <button *ngIf="!user.currentUser" class="follow-btn">
                        <i class="fas fa-user-plus"></i> Follow
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Right Sidebar -->
    <app-sidebar-right></app-sidebar-right>
</div>
