<header class="header-custom">
    <div class="header-container">
        <!-- Logo -->
        <div class="d-flex align-items-center justify-content-center">
            <div class="logo-circle-header d-flex align-items-center justify-content-center">
                <div class="logo-inner-header"></div>
            </div>
            <div class="logo-text-header">1Blog</div>
        </div>

        <!-- Middle Navigation -->
        <div class="d-flex align-items-center nav-links">
            <!-- Home -->
            <a href="/" class="nav-link-custom">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M2 12.204c0-2.289 0-3.433.52-4.381c.518-.949 1.467-1.537 3.364-2.715l2-1.241C9.889 2.622 10.892 2 12 2c1.108 0 2.11.622 4.116 1.867l2 1.241c1.897 1.178 2.846 1.766 3.365 2.715c.519.948.519 2.092.519 4.38v1.522c0 3.9 0 5.851-1.172 7.063C19.657 22 17.771 22 14 22h-4c-3.771 0-5.657 0-6.828-1.212C2 19.576 2 17.626 2 13.725v-1.521Z" />
                        <path stroke-linecap="round" d="M12 15v3" />
                    </g>
                </svg>
            </a>

            <!-- Profile -->
            <button class="nav-btn-custom">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="1.5" color="currentColor">
                        <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12s4.477 10 10 10s10-4.477 10-10" />
                        <path
                            d="m12.401 8.298l2.92-.973c.886-.296 1.33-.443 1.564-.21c.233.234.086.677-.21 1.564l-.973 2.92c-.503 1.51-.755 2.265-1.297 2.806c-.541.542-1.296.794-2.806 1.297l-2.92.973c-.887.296-1.33.444-1.564.21s-.086-.678.21-1.564l.973-2.92c.503-1.51.755-2.265 1.297-2.806c.541-.542 1.296-.794 2.806-1.297M12 12l-.006.006" />
                    </g>
                </svg>
            </button>

            <!-- Notifications -->
            <button class="nav-btn-custom notification-btn">
                <a href="/notifications" class="nav-link-custom">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M18.75 9.71v-.705C18.75 5.136 15.726 2 12 2S5.25 5.136 5.25 9.005v.705a4.4 4.4 0 0 1-.692 2.375L3.45 13.81c-1.011 1.575-.239 3.716 1.52 4.214a25.775 25.775 0 0 0 14.06 0c1.759-.498 2.531-2.639 1.52-4.213l-1.108-1.725a4.4 4.4 0 0 1-.693-2.375Z" />
                        <path stroke-linecap="round" d="M7.5 19c.655 1.748 2.422 3 4.5 3s3.845-1.252 4.5-3M12 6v4" />
                    </g>
                </svg>
                </a>
                <!-- Red dot for new notifications -->
                <span class="notification-dot"></span>
            </button>
        </div>

        <!-- User Avatar -->
        <div class="user-avatar d-flex align-items-center justify-content-center">
            <span class="user-initial">U</span>
        </div>
    </div>
</header>
