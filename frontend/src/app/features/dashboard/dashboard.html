<div class="flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="flex items-center justify-between px-4 py-1">
            <!-- Logo -->
            <div class="flex items-center">
                <div
                    class="w-4 h-4 mr-1 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-full flex items-center justify-center shadow-[0_15px_30px_rgba(79,70,229,0.3)] animate-spin-slow animate-pulse-soft">
                    <div
                        class="w-2 h-2 bg-white rounded-full animate-pulse-inner"></div>
                </div>
                <div class="text-xl font-medium text-gray-800">1Blog</div>
            </div>

            <!-- Middle Navigation -->
            <div class="flex items-center space-x-6">
                <!-- Home -->
                <button
                    class="text-gray-600 hover:text-indigo-600 transition-colors duration-200">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-6 h-6"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3 9.75L12 3l9 6.75V21a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 21V9.75z" />
                    </svg>
                </button>

                <!-- Profile -->
                <button
                    class="text-gray-600 hover:text-indigo-600 transition-colors duration-200">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-6 h-6"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M5.121 17.804A8.967 8.967 0 0112 15c2.21 0 4.21.804 5.879 2.137M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>

                <!-- Notifications -->
                <button
                    class="text-gray-600 hover:text-indigo-600 transition-colors duration-200 relative">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-6 h-6"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C8.67 6.165 8 7.388 8 9v5.159c0 .538-.214 1.055-.595 1.436L6 17h9z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M13 21h-2" />
                    </svg>
                    <!-- Red dot for new notifications -->
                    <span
                        class="absolute top-0 right-0 block w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
            </div>

            <!-- Logout -->
            <button
                class="flex items-center px-4 py-2 text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition-all duration-200">
                <svg
                    class="w-5 h-5 mr-2"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16,17 21,12 16,7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="w-full h-screen p-4">
        <div class="max-w-6xl mx-auto h-full flex gap-4">

            <div class="w-[25%] section">
                 <div class="profile-card bg-white rounded-2xl shadow-md overflow-hidden max-w-xs mx-auto">
        <!-- Cover Image Area -->
        <div class="h-20 bg-gradient-to-r from-orange-200 via-amber-100 to-orange-300 relative">
            <!-- Profile Picture -->
            <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2">
                <div class="w-16 h-16 bg-yellow-400 rounded-full border-4 border-white"></div>
            </div>
        </div>
        
        <!-- Profile Content -->
        <div class="pt-12 pb-6 px-6 text-center">
            <h2 class="text-lg font-bold text-gray-900 mb-1">Reinhard Van Zry</h2>
            <p class="text-gray-500 text-sm mb-6">@Reinhard...</p>
            
            <!-- Stats -->
            <div class="flex justify-around mb-6">
                <div class="text-center">
                    <p class="text-xl font-bold text-gray-900">250</p>
                    <p class="text-xs text-gray-500">Post</p>
                </div>
                <div class="text-center">
                    <p class="text-xl font-bold text-gray-900">2022</p>
                    <p class="text-xs text-gray-500">Followers</p>
                </div>
                <div class="text-center">
                    <p class="text-xl font-bold text-gray-900">500</p>
                    <p class="text-xs text-gray-500">Following</p>
                </div>
            </div>
            
            <!-- Action Button -->
            <button class="w-full bg-blue-500 text-white py-3 px-4 rounded-xl font-medium hover:bg-blue-600 transition-colors">
                My Profile
            </button>
        </div>
    </div>
            </div>

                            class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center mr-3">

                        </div>

                            type="text"
                            class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-gray-600 cursor-pointer hover:bg-gray-200 transition-colors"
                            placeholder="What's on your mind?"

                    </div>

                    <hr class="border-gray-200 mb-4">

                    <div class="flex justify-around">
                        <button
                            class="flex items-center space-x-2 px-4 py-2 hover:bg-gray-100 rounded-lg transition-colors">

                            <span class="text-gray-700 font-medium">Live
                                Video</span>
                        </button>

                        <button

                        </button>
                    </div>
                </div>

                <!-- Posts Feed -->
                <div class="flex-1 space-y-4 overflow-y-auto">
                    <!-- Post 1 -->

                            <button class="hover:text-blue-600">Comment</button>
                            <button class="hover:text-blue-600">Share</button>
                        </div>
                    </div>

                </div>

            <div

        </div>
