<div class="container">
    <div class="left-section">
        <div class="geometric-shape shape-1"></div>
        <div class="geometric-shape shape-2"></div>
        <div class="geometric-shape shape-3"></div>
        <div class="illustration">
            <div class="main-graphic"></div>
        </div>
    </div>

    <div class="right-section">
        <div class="logo">
            <div class="logo-icon"></div>
            <div class="logo-text">1Blog</div>
        </div>

        <div class="header-text">JOIN THE COMMUNITY</div>
        <h1 class="title">
            Create Account on <span class="brand">01Blog</span>
        </h1>

        <form id="registerForm">
            <!-- Username -->
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Choose a username"
                    pattern="^[a-zA-Z0-9_]{3,}$" title="At least 3 characters, letters, numbers, underscores only" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="email">E-Mail</label>
                <input type="email" id="email" class="form-input" placeholder="yourname@gmail.com" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" class="form-input" placeholder="••••••••••••" 
                        minlength="8" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                        👁
                    </button>
                </div>
                <small id="strengthText" style="color:#6b7280;font-size:12px;"></small>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                        👁
                    </button>
                </div>
            </div>

            <!-- Register Button -->
            <button type="submit" class="login-btn">SIGN UP</button>
        </form>

        <p class="subtitle">Already have an account? <a href="/login">Sign In</a></p>

        <div class="footer-text">
            By signing up, you agree to our Terms & Privacy Policy
        </div>
    </div>
</div>
