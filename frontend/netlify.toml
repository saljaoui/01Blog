[build]
  command = "npm run build"
  publish = "dist/01blog-frontend/browser"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/api/*"
  to = "https://p01--backend--q5fnqwdmyzrv.code.run/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://p01--backend--q5fnqwdmyzrv.code.run/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
